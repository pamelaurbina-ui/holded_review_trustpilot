name: Actualizar reviews Holded

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar script de actualizacion
        run: python update_reviews.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holded_reviews.xlsx
          if git diff --cached --quiet; then
            echo "Sin reviews nuevas, nada que commitear."
          else
            git commit -m "Actualizar reviews Holded [automated]"
            git push
          fi
